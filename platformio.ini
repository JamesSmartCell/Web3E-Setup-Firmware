; PlatformIO Project Configuration File
; ESP32 Web3E Setup Firmware
; 
; This firmware provisions Wi-Fi and OTA-installs project firmware from Cloudflare R2.
; Per-project configuration via build_flags below.

[platformio]
default_envs = esp32dev

; Common ESP32 settings (not inherited by native)
[env:esp32-common]
framework = arduino
lib_deps = 
    https://github.com/AlphaWallet/Web3E.git

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition scheme: two OTA slots for recovery
; Removed partition scheme - uses ESP32 default

lib_deps = 
    https://github.com/AlphaWallet/Web3E.git
    bblanchon/ArduinoJson@^7.0.0

build_flags = 
    ; === PER-PROJECT CONFIGURATION (EDIT THESE) ===
    ; SmartLayerProxy coordinator (primary method)
    -DPROXY_BASE_URL=\"https://proxy.example.com\"
    -DPROJECT_ID=\"my-project-id\"
    
    ; Optional: Direct firmware URL override (for testing without proxy)
    ; When set, skips proxy and downloads directly from this URL
    ; -DFIRMWARE_URL=\"https://example.r2.dev/my-project/firmware.bin\"
    ; -DFIRMWARE_SHA256=\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\"
    
    ; Optional: Captive portal Access Point configuration
    ; Default SSID will be "ESP32-Setup-XXXX" where XXXX = last 4 hex of MAC
    -DAP_SSID_PREFIX=\"ESP32-Setup\"
    
    ; Optional: AP password (leave empty for open network)
    ; -DAP_PASSWORD=\"setuppass123\"
    
    ; Optional: Maximum networks to store (default 8)
    -DMAX_WIFI_NETWORKS=8

[env:native]
platform = native
lib_deps =
lib_compat_mode = off
build_flags = 
    -std=c++11
    -DNATIVE_TEST
    -DMAX_WIFI_NETWORKS=8
test_build_src = no
; Native environment doesn't use Arduino framework
; Tests run with Unity test framework only
